name: Build NextBSD desktop (cross)

# Cross-builds the whole NextBSD desktop (nextbsd/nextbsd#675) for amd64 and
# arm64 on the x86_64 runner, inside the per-arch nextbsd-toolchain container,
# against the GNUstep SDK that nextbsd-gnustep publishes: WindowServer and its
# client library and tools, libs-back's WindowServer backend, loginwindow,
# Workspace, the Dock and its extras, Terminal, the settings apps, Software,
# Update, Installer, XLibre, the InnerSpace modules and the theme, from the
# commits in sources.lock. Nothing built for NextBSD runs here.
#
# Per arch it produces:
#   nextbsd-desktop-<arch>.tar.gz   the staged install, rooted at /, for
#                                   nextbsd-pkg's NextBSD-desktop-apps;
#   desktop-manifest-<arch>         MANIFEST (every staged path, with type,
#                                   mode, size, SHA-256 and repository),
#                                   LOCATIONS (where each app went) and
#                                   BUILD-INFO (the commits);
#   desktop-build-report-<arch>     build times, logs, each repository's
#                                   warnings and the files it installed.
#
# Builds run on pull requests, pushes to main and by hand; a push to main or a
# manual run from main also publishes the tarballs to the `continuous`
# release. Nothing is dispatched to other repos.
#
# The component repositories don't tell this one when they merge, so a
# schedule polls them: every 30 minutes `changes` compares sources-state.sh's
# list (each sources.lock ref's tip, the SDK and nextbsd-xlibre uploads) with
# the SOURCES asset of the last publish, and builds and publishes only when
# something moved. A merge to any component reaches `continuous` within about
# half an hour plus the build.

on:
  push:
    branches: [main]
    paths: ['build-desktop.sh', 'fetch-sdk.sh', 'sources-state.sh', 'sources.lock', 'System/**', '.github/workflows/build.yml']
  pull_request:
    paths: ['build-desktop.sh', 'fetch-sdk.sh', 'sources-state.sh', 'sources.lock', 'System/**', '.github/workflows/build.yml']
  schedule:
    # Off the hour and half hour, which GitHub drops when it is busy.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      fbsd_sha:
        description: 'Pinned FreeBSD SHA for the toolchain image tag (blank = latest)'
        required: false
        default: ''
      sdk_run:
        description: 'nextbsd-gnustep run id to take the SDK from (blank = continuous release)'
        required: false
        default: ''

# One run per PR: a new push cancels the PR's previous run. Runs on main
# publish `continuous`, so they queue instead of being cancelled.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # What this build is made from, and whether a scheduled run has anything to
  # do: it builds when SOURCES differs from the last publish's and these
  # sources haven't been tried before (the cache remembers each attempt, so a
  # broken component builds once, not every 30 minutes). Every other event
  # builds.
  changes:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.compare.outputs.build }}
    steps:
      - uses: actions/checkout@v4
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .build/published
          ./sources-state.sh > .build/SOURCES
          cat .build/SOURCES
          echo "hash=$(sha256sum .build/SOURCES | cut -c1-16)" >> "$GITHUB_OUTPUT"
      - id: tried
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@v4
        with:
          path: .build/SOURCES
          key: desktop-tried-${{ steps.state.outputs.hash }}
          lookup-only: true
      - id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          TRIED: ${{ steps.tried.outputs.cache-hit }}
        run: |
          build=true
          if [ "$EVENT" = schedule ]; then
            if gh release download continuous --repo "$GITHUB_REPOSITORY" --pattern SOURCES \
                   --dir .build/published 2>/dev/null &&
               cmp -s .build/SOURCES .build/published/SOURCES; then
              build=false
              echo "Nothing moved since the last publish."
            elif [ "$TRIED" = true ]; then
              build=false
              echo "These sources were already built once and didn't publish; not retrying."
            else
              diff .build/published/SOURCES .build/SOURCES || true
            fi
          fi
          echo "build=$build" >> "$GITHUB_OUTPUT"
      - if: github.event_name == 'schedule' && steps.compare.outputs.build == 'true'
        uses: actions/cache/save@v4
        with:
          path: .build/SOURCES
          key: desktop-tried-${{ steps.state.outputs.hash }}
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-sources
          path: .build/SOURCES

  build:
    name: desktop (${{ matrix.arch }})
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    container:
      image: ghcr.io/nextbsd/nextbsd-toolchain:${{ matrix.arch }}-${{ inputs.fbsd_sha && format('fbsd-{0}', inputs.fbsd_sha) || 'latest' }}
    steps:
      - uses: actions/checkout@v4

      # plmerge and pl2link for the build host: gnustep-make runs them on
      # bundles and apps, and the SDK's own are NextBSD programs.
      - name: Install build-host tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends gnustep-base-runtime
          command -v plmerge pl2link gh curl

      - name: Fetch the GNUstep SDK
        env:
          GH_TOKEN: ${{ github.token }}
          T: ${{ matrix.arch }}
          OUT: /opt/sdk
          SDK_RUN: ${{ inputs.sdk_run }}
        run: ./fetch-sdk.sh

      # Other NextBSD packages the desktop runs on beyond the SDK's sysroot,
      # for the checks only: nextbsd-xlibre has Xnextbsd's libepoxy.
      - name: Fetch run-time packages for the checks
        env:
          GH_TOKEN: ${{ github.token }}
          A: ${{ matrix.arch }}
        run: |
          mkdir -p /opt/runtime/nextbsd-xlibre /opt/runtime/dl
          gh release download continuous --repo nextbsd/nextbsd-xlibre --pattern "nextbsd-xlibre-$A.tar.gz" --dir /opt/runtime/dl
          tar -C /opt/runtime/nextbsd-xlibre -xzf "/opt/runtime/dl/nextbsd-xlibre-$A.tar.gz"

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: desktop-ccache-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: desktop-ccache-${{ matrix.arch }}-

      - name: Cross-build the desktop into /stage
        env:
          T: ${{ matrix.arch }}
          SDK: /opt/sdk/nextbsd-gnustep-sdk-${{ matrix.arch }}
          DESTDIR: /stage
          CCACHE: '1'
          RUNTIME_ROOTS: nextbsd-xlibre=/opt/runtime/nextbsd-xlibre
        run: |
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_MAXSIZE=2G
          export SDK_ORIGIN="$(cat /opt/sdk/SDK-ORIGIN)"
          ccache -z
          rc=0; ./build-desktop.sh || rc=$?
          ccache -s
          # The report is uploaded even on failure.
          mkdir -p ".build/report-$T"
          cp -R ".build/logs-$T" ".build/warnings-$T" ".build/files-$T" ".build/report-$T/" 2>/dev/null || true
          cp ".build/times-$T.tsv" ".build/warnings-$T.tsv" ".build/BUILD-INFO-$T" ".build/report-$T/" 2>/dev/null || true
          exit $rc

      - name: Pack
        env:
          T: ${{ matrix.arch }}
        run: |
          mkdir -p .build/out ".build/manifest-$T"
          tar -C /stage --numeric-owner --owner=0 --group=0 -czf ".build/out/nextbsd-desktop-$T.tar.gz" .
          cp ".build/MANIFEST-$T.tsv" ".build/LOCATIONS-$T" ".build/BUILD-INFO-$T" ".build/RUNTIME-DEPS-$T" ".build/manifest-$T/"
          ls -la .build/out
          {
            echo "### NextBSD desktop cross-build, $T"
            echo
            echo "Staged: $(du -sh /stage | cut -f1), packed: $(du -h .build/out/nextbsd-desktop-$T.tar.gz | cut -f1), $(grep -c . .build/MANIFEST-$T.tsv) paths."
            echo
            echo "| repository | seconds | distinct warnings |"
            echo "|---|---:|---:|"
            awk -F'\t' 'NR == FNR { w[$2] = $3; next } { print "| " $2 " | " $3 " | " (($2 in w) ? w[$2] : "") " |" }' \
              ".build/warnings-$T.tsv" ".build/times-$T.tsv"
            echo
            echo "Where each app went:"
            echo
            echo '```'
            column -t -s "$(printf '\t')" ".build/LOCATIONS-$T" | grep -E 'CoreServices/|Applications/|Themes/|InnerSpace$|Bundles/|libexec/|/usr/lib/' | grep -v '/InnerSpace/' | head -80
            echo '```'
            echo
            echo "Sources:"
            echo
            awk -F'\t' '{ print "- " $1 " " $3 " " substr($4, 1, 19) }' ".build/BUILD-INFO-$T"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: nextbsd-desktop-${{ matrix.arch }}
          path: .build/out/nextbsd-desktop-${{ matrix.arch }}.tar.gz
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-manifest-${{ matrix.arch }}
          path: .build/manifest-${{ matrix.arch }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-build-report-${{ matrix.arch }}
          path: .build/report-${{ matrix.arch }}
          if-no-files-found: ignore

  publish:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: nextbsd-desktop-*
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          name: desktop-sources
      - name: Gather artifacts
        run: |
          mkdir -p out
          find artifacts -name 'nextbsd-desktop-*.tar.gz' -exec cp {} out/ \;
          cp artifacts/SOURCES out/
          ls -la out/
      - name: Publish to continuous release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: continuous
          name: Continuous desktop build
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            out/*.tar.gz
            out/SOURCES
